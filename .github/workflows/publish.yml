name: publish

# Trusted publishing (OIDC) — no long-lived npm token is stored in this repository.
#
# One-time setup on npmjs.com:
#   Packages -> dsh-desktop-shell -> Settings -> Trusted publishing -> Add trusted publisher
#     Publisher:            GitHub Actions
#     Organization or user: RINGOLINK
#     Repository:           dsh-desktop-shell
#     Workflow filename:    publish.yml
#     Allowed actions:      npm publish
#
# Afterwards a tag is all it takes:  git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write     # OIDC token for npm trusted publishing (and provenance)

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/install.test.mjs

  npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Deliberately no `registry-url`: setup-node would write an .npmrc pointing at
      # ${NODE_AUTH_TOKEN}, which trusted publishing does not use.
      - name: Require npm >= 11.5.1 (trusted publishing)
        run: node -e "const {execSync}=require('node:child_process');const v=execSync('npm --version').toString().trim();const [a,b]=v.split('.').map(Number);if(a<11||(a===11&&b<5)){console.error('npm '+v+' is too old; trusted publishing requires >= 11.5.1');process.exit(1)}console.log('npm '+v+' ok')"
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const pkg=require('./package.json');const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(pkg.version!==tag){console.error('tag '+tag+' does not match package.json version '+pkg.version);process.exit(1)}console.log('version '+pkg.version+' matches tag')"
      - run: npm publish --access public
